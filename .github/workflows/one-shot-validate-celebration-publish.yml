name: One-shot LP publication validation

on:
  push:
    branches:
      - fix/validate-celebration-publish

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Add one-shot LP publication validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validate-celebration-publish
          fetch-depth: 0

      - name: Build composed public tools site
        run: npm run build

      - name: Validate composed public tools site
        run: npm run validate

      - name: Confirm reliable LP assets were composed
        shell: bash
        run: |
          test -f dist/linear-programming/app.celebration-reliable-20260904-v1.js
          test -f dist/linear-programming/styles.celebration-reliable-20260904-v1.css
          grep -q 'app.celebration-reliable-20260904-v1.js' dist/linear-programming/index.html
          grep -q 'styles.celebration-reliable-20260904-v1.css' dist/linear-programming/index.html
          grep -q 'const CONFETTI_PIECES_PER_SIDE = 90;' dist/linear-programming/app.celebration-reliable-20260904-v1.js
          grep -q 'applyStaticSolutionCelebration' dist/linear-programming/app.celebration-reliable-20260904-v1.js

      - name: Record successful validation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-validate-celebration-publish.yml
          mkdir -p validation
          printf '%s\n' 'LP celebration publication build and validation passed.' > validation/celebration-publish.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-validate-celebration-publish.yml validation/celebration-publish.txt
          git commit -m "Confirm reliable LP celebration publication build"
          git push origin HEAD:fix/validate-celebration-publish
